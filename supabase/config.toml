# A Supabase CLI projektleírója.
#
# Enélkül a CLI el sem indul: ebből ismeri fel a projektgyökeret. Sokáig
# hiányzott, miközben a `kiolvas/README.md` már ígérte a CLI-s telepítést —
# vagyis egy parancsot dokumentáltunk, ami nem futott le. Ugyanaz a hibaosztály,
# amit ebben a projektben mindenhol máshol is javítunk: ígéret, amit a kód nem
# tart be.
project_id = "szamlafolyo"

# Mindkét függvény itt áll, nem csak az, amit épp telepítünk. Az ok gyakorlati:
# a CLI a `config.toml`-ból veszi a beállításokat, és ami nincs leírva, azt egy
# telepítés **csendben visszaállíthatja** az alapértékre. Egy `verify_jwt`,
# ami magától kikapcsol, pont az a fajta hiba, amit senki nem vesz észre.

[functions.kiolvas]
# ⚠️ Maradjon bekapcsolva. A `shared/uzleti/token.ts` érvelése **arra
# támaszkodik**, hogy a platform a tokent már hitelesítette, mire a kód megnézi
# a `role` állítását — ezt méréssel igazoltuk: hamis aláírású, `service_role`
# szerepű token 401-et kap, el sem jut a kódig. Kikapcsolva a kötegelt hívás
# védtelen maradna.
verify_jwt = true
import_map = "./functions/deno.json"
# A **forrás** a belépési pont, nem a generált csomag. A `kiolvas.bundle.js`
# azért született, mert az MCP-s telepítés hívásába nem fér be sok fájl; a CLI
# viszont maga oldja fel a `../../../shared/…` importokat az import-térkép
# szerint, tehát nincs szüksége csomagra.
#
# Ha a CLI mégis elakadna rajtuk, a kijárat egyetlen sor: írd át ezt
# `./functions/kiolvas/kiolvas.bundle.js`-re. Az a korábban telepített artefakt
# alakja, tehát bizonyítottan fut — csak előtte `npm run kiolvas:csomag` kell.
entrypoint = "./functions/kiolvas/index.ts"

[functions.selejtez]
# A selejtező a `szolgaltatasSzerep()`-elvvel szűri a hívót, ugyanazon az
# alapon, mint a `kiolvas` kötegelt ága.
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/selejtez/index.ts"

[functions.email-bekuldes]
# ⚠️ **Itt a `verify_jwt` KI van kapcsolva**, és ez nem lazítás, hanem
# kényszer: a levélszolgáltató nem tud Supabase-JWT-t küldeni. (A másik ilyen
# a `meghivo-fiok` — ott a meghívottnak nincs még fiókja, tehát tokenje sem.) Bekapcsolva a platform minden bejövő levelet 401-gyel utasítana el,
# és a beküldés egyszerűen nem működne.
#
# Cserébe a hitelesítés **teljes egészében** a kódban van: a függvény legelső
# művelete a webhook-aláírás ellenőrzése (`shared/uzleti/alairas.ts`) a
# `RESEND_WEBHOOK_SECRET` titokkal, a nyers kérés-testtel, időbélyeg-tűréssel
# és állandó idejű összehasonlítással. Aláírás nélkül a kód nem olvas
# adatbázist, nem tölt le semmit, és nem ír naplót.
#
# Vagyis amit a `kiolvas`-nál a platform intéz, azt itt az `alairas.ts` intézi.
# Ha valaki ezt a sort `true`-ra állítja, a beküldés **némán megáll** — a
# levelek eltűnnek, és a felületen semmi nem jelzi.
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/email-bekuldes/index.ts"

[functions.meghivo-kuld]
# Itt **bekapcsolva** marad, szemben az `email-bekuldes`-szel: ezt a végpontot
# egy belépett tulajdonos hívja a böngészőből, tehát van érvényes JWT-je.
#
# A függvény ráadásul **támaszkodik is erre**: a levélbe írt „ki hívott" a token
# `email` állításából jön, és azt csak azért olvashatjuk ellenőrzés nélkül, mert
# a platform a tokent addigra már hitelesítette. Kikapcsolva bárki tetszőleges
# feladót írhatna a mi nevünkben kimenő levélbe.
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/meghivo-kuld/index.ts"

[functions.meghivo-fiok]
# ⚠️ **A második függvény, ahol a `verify_jwt` KI van kapcsolva** — és itt is
# kényszerből: a meghívottnak ebben a pillanatban még **nincs fiókja**, tehát
# JWT-je sincs. Bekapcsolva a platform minden meghívós fióknyitást 401-gyel
# utasítana el, vagyis a függvény pont azt nem tudná megtenni, amiért van.
#
# A hitelesítés helyette a **meghívó jele**: 24 karakter a félreolvashatatlan
# ábécéből (~119 bit), amit a tulajdonos adott ki egyetlen, általa megnevezett
# címre. A függvény ezen kívül semmit nem fogad el a hívótól: a fiók címét a
# meghívóból veszi, nem a kérésből.
#
# Ez a végpont az, ami lehetővé teszi, hogy a Supabase `disable_signup`
# kapcsolója BE legyen kapcsolva: a nyilvános regisztráció zárva, a meghívás
# mégis működik. Ha valaki ezt a függvényt törli vagy elrontja, a meghívás
# **némán megáll**, és a felületen csak annyi látszik, hogy nem sikerült fiókot
# nyitni.
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/meghivo-fiok/index.ts"

[functions.stripe-checkout]
# Bekapcsolva: ezt a végpontot egy belépett tulajdonos hívja a böngészőből.
#
# A függvény **támaszkodik is rá**: a hívó azonosítóját a token `sub`
# állításából olvassa, ellenőrzés nélkül — azt csak azért teheti meg, mert a
# platform a tokent addigra már hitelesítette. Kikapcsolva bárki indíthatna
# előfizetést tetszőleges cég nevében, mert a cég a felhasználóból következik.
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/stripe-checkout/index.ts"

[functions.stripe-webhook]
# ⚠️ **A harmadik függvény, ahol a `verify_jwt` KI van kapcsolva** — és itt is
# kényszerből: a Stripe nem tud Supabase-JWT-t küldeni.
#
# A hitelesítés helyette az **aláírás**: HMAC-SHA256 a `<időbélyeg>.<nyers
# test>` fölött, a végpont `whsec_…` titkával, időbélyeg-tűréssel és állandó
# idejű összehasonlítással (`shared/uzleti/stripe/alairas.ts`). Ez a végpont
# írja a cég számlázási állapotát, tehát az aláírás nélkül bárki Pro csomagra
# tehetné magát egy HTTP-kéréssel.
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/stripe-webhook/index.ts"
